<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compass</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Compass</h1>
    <div class="header-right">
      <div id="loop-controls" class="loop-controls">
        <span id="phase-pill" class="phase-pill">idle</span>
        <button id="approve-btn" class="ctrl ctrl-primary" hidden>Approve Next</button>
        <button id="pause-btn" class="ctrl">Pause</button>
        <button id="resume-btn" class="ctrl" hidden>Resume</button>
        <button id="cancel-btn" class="ctrl ctrl-danger" hidden>Cancel iteration</button>
        <label class="toggle">
          <input type="checkbox" id="approve-required-toggle" checked>
          <span>Require approval</span>
        </label>
      </div>
      <div id="status" class="status">
        <span id="status-indicator" class="indicator"></span>
        <span id="status-text">Connecting...</span>
      </div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="activity">Activity</button>
    <button class="tab" data-tab="state">State</button>
    <button class="tab" data-tab="sessions">Sessions <span id="sessions-badge" class="badge"></span></button>
    <button class="tab" data-tab="drafts">Drafts <span id="drafts-badge" class="badge"></span></button>
    <button class="tab" data-tab="feedback">Feedback</button>
  </nav>

  <main>
    <section id="activity-panel" class="panel active">
      <div id="activity-log"></div>
    </section>

    <section id="state-panel" class="panel">
      <div id="state-content"></div>
    </section>

    <section id="sessions-panel" class="panel">
      <div id="sessions-content"></div>
    </section>

    <section id="drafts-panel" class="panel">
      <div class="drafts-form">
        <h3>Add a draft plan</h3>
        <p class="form-hint">
          Drop a rough idea — a feature, a fix, a direction. The Plan agent will refine
          and integrate it on the next iteration.
        </p>
        <form id="draft-form">
          <textarea
            id="draft-content"
            placeholder="What should Compass work on next?"
            rows="3"
            required
          ></textarea>
          <button type="submit">Add draft</button>
        </form>
      </div>
      <h3 class="section-heading">Pending drafts</h3>
      <div id="drafts-content"></div>
    </section>

    <section id="feedback-panel" class="panel">
      <p class="form-hint">
        Notes the Develop agent left for the Plan agent at the end of the last iteration.
        Cleared once Plan reads them.
      </p>
      <div id="feedback-content"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
