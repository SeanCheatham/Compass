			shellPath = /bin/bash;
			shellScript = "# Copy the freshly-built Debug app to /Applications so the\n# Virtualization.framework installation helper will accept connections from us.\n#\n# This is on by default for developer builds because VZ restore/install helper\n# checks reject the same bundle from DerivedData. The destination defaults to\n# /Applications/CompassLocal.app so debug builds never overwrite a real\n# /Applications/Compass.app install.\n#\n# Two failure modes are at play, both with the same symptom (VZErrorDomain\n# 10001 / 10004, 'Installation service returned an unexpected error'):\n#\n#   1) The bundle's path matters. The VZ install helper, via TCC, refuses\n#      callers whose .app lives under ~/Library/Developer/Xcode/DerivedData/.\n#      Running the same binary from /Applications fixes the path-based check.\n#\n#   2) The launching parent matters. Even from /Applications, a process\n#      spawned by Xcode/lldb (via debugserver) gets treated as a tools child\n#      and the helper still rejects it. So the app must be launched by\n#      Finder/launchd, not by Xcode.\nset -euo pipefail\nif [[ \"${CONFIGURATION:-}\" != \"Debug\" ]]; then\n  echo \"Skipping /Applications debug copy for ${CONFIGURATION:-unknown} build\"\n  exit 0\nfi\nif [[ \"${COMPASS_COPY_DEBUG_APP_TO_APPLICATIONS:-YES}\" != \"YES\" ]]; then\n  echo \"Skipping /Applications debug copy; COMPASS_COPY_DEBUG_APP_TO_APPLICATIONS=${COMPASS_COPY_DEBUG_APP_TO_APPLICATIONS:-NO}\"\n  exit 0\nfi\nSRC=\"${BUILT_PRODUCTS_DIR}/${WRAPPER_NAME}\"\nDEST=\"${COMPASS_DEBUG_APP_PATH:-/Applications/CompassLocal.app}\"\ncase \"${DEST}\" in\n  /Applications/*) ;;\n  *) echo \"error: COMPASS_DEBUG_APP_PATH must be under /Applications for VZ helper testing: ${DEST}\" >&2; exit 1 ;;\nesac\nif [[ -e \"${DEST}\" && ! -w \"${DEST}\" ]]; then\n  echo \"error: ${DEST} is not writable. Choose another COMPASS_DEBUG_APP_PATH or fix permissions.\" >&2\n  exit 1\nfi\nditto \"${SRC}\" \"${DEST}\"\necho \"Copied ${WRAPPER_NAME} to ${DEST}\"\n";
		};
