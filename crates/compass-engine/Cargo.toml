[package]
name = "compass-engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "compass_engine"
path = "src/lib.rs"

[[bin]]
name = "compass-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
camino = { version = "1.1", features = ["serde1"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
